name: Windows build

# Windows is the main machine for interviews, so every change is tested and
# built on a real Windows runner. Download the installer from the run's
# "Artifacts" section. Pushing a version tag (v1.2.3) also publishes a
# GitHub Release, which the installed app updates itself from.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used to publish a Release on version tags
    env:
      ASSEMBLY_AI_API_KEY: ${{ secrets.ASSEMBLY_AI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Start the app and check it loads (smoke test)
        run: npm run smoke

      # Runs only if you add ASSEMBLY_AI_API_KEY and GROQ_API_KEY as
      # repository secrets; otherwise skipped.
      - name: Live pipeline test (real AssemblyAI + Groq, Windows speech)
        if: ${{ env.ASSEMBLY_AI_API_KEY != '' && env.GROQ_API_KEY != '' }}
        env:
          FAST_LLM_PRESET: groq
        run: npm run test:live

      - name: Build installer and portable .exe
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build:win -- --publish never

      - name: Build and publish the GitHub Release (version tags)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win -- --publish always

      # The packaged app has locked Electron fuses (no ELECTRON_RUN_AS_NODE,
      # ASAR integrity checked); make sure it still starts.
      - name: Start the packaged app (smoke test)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/win-unpacked -Filter *.exe | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -Wait -PassThru
          Write-Host "Packaged smoke test exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: meeting-assistant-windows
          path: |
            dist/*.exe
          retention-days: 14
          if-no-files-found: error
